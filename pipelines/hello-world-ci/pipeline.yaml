# Uses the vendored Tekton catalog Tasks in this directory (git-clone,
# maven, buildah) instead of hand-rolled ones -- see the header comment in
# each task-*.yaml for where they came from and what's overridden.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hello-world-ci-pipeline
  namespace: default
spec:
  params:
    - name: git-repo-url
    - name: git-revision
      default: "main"
    - name: image
  workspaces:
    - name: source
    - name: git-credentials
    - name: maven-settings
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-repo-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: git-credentials
    - name: build
      runAfter: ["fetch-source"]
      taskRef:
        name: maven
      params:
        - name: MAVEN_IMAGE
          value: maven:3.9.9-eclipse-temurin-21
        - name: GOALS
          value: ["-DskipTests", "clean", "package"]
      workspaces:
        - name: source
          workspace: source
        - name: maven-settings
          workspace: maven-settings
        - name: maven-local-repo
          workspace: source
          subPath: m2-repo
    - name: test
      runAfter: ["build"]
      taskRef:
        name: maven
      params:
        - name: MAVEN_IMAGE
          value: maven:3.9.9-eclipse-temurin-21
        - name: GOALS
          value: ["test"]
      workspaces:
        - name: source
          workspace: source
        - name: maven-settings
          workspace: maven-settings
        - name: maven-local-repo
          workspace: source
          subPath: m2-repo
    - name: build-and-push-image
      runAfter: ["test"]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.image)
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: source
