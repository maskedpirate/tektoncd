apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: default
spec:
  params:
    - name: url
    - name: revision
      default: "main"
  workspaces:
    - name: source
    - name: git-credentials
  steps:
    - name: clone
      image: alpine/git:2.45.2
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        rm -rf "$(workspaces.source.path)"/* "$(workspaces.source.path)"/.[!.]* 2>/dev/null || true
        GIT_USER=$(cat "$(workspaces.git-credentials.path)/username")
        GIT_PASS=$(cat "$(workspaces.git-credentials.path)/password")
        AUTH_URL=$(echo "$(params.url)" | sed -E "s#^(https?)://#\1://${GIT_USER}:${GIT_PASS}@#")
        git clone "$AUTH_URL" .
        git checkout "$(params.revision)"
