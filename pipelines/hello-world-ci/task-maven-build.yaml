apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build
  namespace: default
spec:
  workspaces:
    - name: source
  steps:
    - name: build
      image: maven:3.9.9-eclipse-temurin-21
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        mvn -B -DskipTests clean package
